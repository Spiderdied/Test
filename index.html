  <!-- Sequential non-blocking Firebase SDK loader (Auth + Firestore + Storage) -->
  <script>
    (function loadFirebaseSdkSequentially() {
      var urls = [
        'https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js',
        'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js',
        'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js',
        'https://www.gstatic.com/firebasejs/12.19.0/firebase-storage-compat.js'
      ];
      var idx = 0;
      function next() {
        if (idx >= urls.length) {
          if (window.UBADAuth && typeof window.UBADAuth.tryInitFirebaseSdk === 'function') {
            window.UBADAuth.tryInitFirebaseSdk();
          }
          return;
        }
        var s = document.createElement('script');
        s.src = urls[idx++];
        s.async = true;
        s.onload = next;
        s.onerror = function() {
          if (window.UBADAuth && typeof window.UBADAuth.markOfflineReady === 'function') {
            window.UBADAuth.markOfflineReady();
          }
        };
        document.body.appendChild(s);
      }
      if (document.readyState === 'complete') next();
      else window.addEventListener('load', next);
    })();

    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').catch(function(){});
      });
    }
  </script>

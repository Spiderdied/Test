<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>UBAD Hub — icon exporter</title>
<style>
  body{background:#050816;color:#E6E9FF;font:14px/1.5 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0}
  .box{background:rgba(15,23,50,.6);border:1px solid rgba(140,160,255,.2);border-radius:16px;padding:28px;text-align:center}
  button{margin:6px;padding:10px 16px;border-radius:10px;border:1px solid rgba(139,92,246,.5);
    background:rgba(139,92,246,.15);color:#D9CBFF;font-weight:600;cursor:pointer}
  canvas{margin:10px;border-radius:14px}
  p{color:#A9B2D6;max-width:420px}
  code{color:#A5F3FC}
</style></head>
<body>
<div class="box">
  <h2>UBAD Hub — icon exporter</h2>
  <p>Click a button to download a PNG icon. Place the files in
     <code>assets/icons/</code>, then redeploy.</p>
  <canvas id="cv" width="192" height="192"></canvas>
  <div>
    <button data-size="192" data-kind="any">icon-192.png</button>
    <button data-size="512" data-kind="any">icon-512.png</button>
    <button data-size="512" data-kind="maskable">icon-maskable-512.png</button>
    <button data-size="180" data-kind="apple">apple-touch-icon.png</button>
  </div>
  <button id="all" style="border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.12);color:#A5F3FC">⬇ Download all 4</button>
</div>
<script>
/* draws the exact same "U" logo as the app, straight on canvas */
function draw(size,kind){
  const c=document.createElement('canvas');c.width=c.height=size;
  const x=c.getContext('2d');const s=size/64;
  x.save();x.scale(s,s);
  if(kind==='maskable'){x.fillStyle='#0A1024';x.fillRect(0,0,64,64);x.translate(8,8);x.scale(.75,.75);}
  else if(kind==='apple'){x.fillStyle='#0A1024';x.fillRect(0,0,64,64);}
  else{x.fillStyle='#0A1024';
    if(x.roundRect){x.beginPath();x.roundRect(0,0,64,64,15);x.fill();}
    else x.fillRect(0,0,64,64);
    x.strokeStyle='rgba(140,160,255,.28)';x.lineWidth=1;
    if(x.roundRect){x.beginPath();x.roundRect(1,1,62,62,14);x.stroke();}}
  const g=x.createLinearGradient(0,0,64,64);
  g.addColorStop(0,'#22D3EE');g.addColorStop(.55,'#3B82F6');g.addColorStop(1,'#8B5CF6');
  x.strokeStyle=g;x.lineWidth=7;x.lineCap='round';
  x.beginPath();x.moveTo(20,15);x.lineTo(20,34);x.arc(32,34,12,Math.PI,0,true);x.lineTo(44,15);x.stroke();
  x.fillStyle='#22D3EE';x.beginPath();x.arc(47.5,14.5,3,0,7);x.fill();
  x.restore();return c;
}
function dl(canvas,name){canvas.toBlob(b=>{
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);});}
document.querySelectorAll('button[data-size]').forEach(b=>b.addEventListener('click',()=>{
  const kind=b.dataset.kind, size=+b.dataset.size;
  const name=kind==='apple'?'apple-touch-icon.png'
    :kind==='maskable'?'icon-maskable-512.png':'icon-'+size+'.png';
  dl(draw(size,kind),name);
}));
document.getElementById('all').addEventListener('click',()=>{
  [[192,'any','icon-192.png'],[512,'any','icon-512.png'],
   [512,'maskable','icon-maskable-512.png'],[180,'apple','apple-touch-icon.png']]
  .forEach((j,i)=>setTimeout(()=>dl(draw(j[0],j[1]),j[2]),i*450));
});
document.getElementById('cv').getContext('2d').drawImage(draw(192,'any'),0,0);
</script>
</body>
</html>
